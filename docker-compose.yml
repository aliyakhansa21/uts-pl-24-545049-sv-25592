version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: db_inventaris
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - inventaris_network
    # --- TAMBAHAN TUGAS 6: Healthcheck & Limit Log untuk DB ---
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_inventaris
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG}
      SESSION_DRIVER: file
      CACHE_STORE: file
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # --- TAMBAHAN TUGAS 6: Log ke stdout ---
      LOG_CHANNEL: stderr 
      SERVER_NAME: :80
    depends_on:
      # --- TAMBAHAN TUGAS 6: Menunggu DB Healthy ---
      db:
        condition: service_healthy
    networks:
      - inventaris_network
    # --- TAMBAHAN TUGAS 6: Healthcheck & Limit Log untuk Backend ---
    healthcheck:
      # Karena port internal container adalah 80, kita hit ke http://localhost/health
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend_inventaris
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - inventaris_network

networks:
  inventaris_network:
    driver: bridge

volumes:
  db_data: